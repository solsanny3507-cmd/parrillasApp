<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="es">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="mobile-web-app-capable" content="yes"/>
            <link rel="icon" href="#{request.contextPath}/resources/freya-layout/images/sidebar-logo.ico" type="image/x-icon"></link>
        </f:facet>
        <title><ui:insert name="title">ParrillasApp</ui:insert></title>
        <h:outputScript name="js/layout.js" library="freya-layout" />
        <h:outputScript name="js/prism.js" library="freya-layout"/>
        <h:outputScript name="locales/locale-es.js" library="primefaces" />
        <ui:insert name="head"/>
    </h:head>

    <h:body styleClass="#{guestPreferences.inputStyleClass}">
        <div class="layout-wrapper layout-topbar-#{guestPreferences.topbarTheme} layout-menu-#{guestPreferences.menuTheme} #{guestPreferences.menuMode}" >
            <ui:include src="./topbar.xhtml"/>

            <div class="layout-main"> 
                <div class="layout-content">
                    <ui:insert name="content"/>
                </div>
                <ui:include src="./footer.xhtml"/>
            </div>

            <p:ajaxStatus style="width: 48px; height: 48px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999;">
                <f:facet name="start">
                    <i class="pi pi-spin pi-spinner ajax-loader" style="font-size: 4rem;" aria-hidden="true"/>
                </f:facet>

                <f:facet name="complete">
                    <h:outputText value="" />
                </f:facet>
            </p:ajaxStatus>
            <div class="layout-mask modal-in"></div>
        </div>
        <h:outputStylesheet name="css/primeicons.css" library="freya-layout" />
        <h:outputStylesheet name="css/primeflex.min.css" library="freya-layout" />
        <h:outputStylesheet name="css/#{guestPreferences.layout}.css" library="freya-layout" />
        <h:outputStylesheet name="css/demo-#{guestPreferences.darkMode}.css" library="demo" />
        <h:outputStylesheet name="css/epmmop-style.css" library="epmmop-layout" />
        <h:outputStylesheet name="css/status.css" library="epmmop-layout" />
        <script src="https://kit.fontawesome.com/0049360160.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </h:body>

</html>
