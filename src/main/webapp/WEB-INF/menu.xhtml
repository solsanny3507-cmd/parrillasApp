<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html" 
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:fr="http://primefaces.org/freya">

<div class="menu-wrapper">
    <div class="sidebar-logo">
        <a href="booking.xhtml">

        <a href="#" class="sidebar-pin" title="Toggle Menu">

                <p:menuitem id="m_history" value="Historial de pagos" icon="pi pi-list" outcome="history" />
                <p:menuitem id="m_faqs" value="Preguntas Frecuentes" icon="pi pi-question-circle" outcome="faqs" />

</ui:composition>
